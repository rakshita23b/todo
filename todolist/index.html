
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - My To Do List</title>

    <!-- CSS Connection -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="header">

            <div>
                <p class="date-label">MY WORKSPACE</p>

                <h1>My Tasks</h1>

                <p class="subtitle">
                    Stay organized and get things done.
                </p>
            </div>

            <div class="profile">T</div>

        </header>


        <!-- ADD TASK SECTION -->
        <section class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button type="button" id="addBtn">
                + Add Task
            </button>

        </section>


        <!-- TASK SUMMARY -->
        <section class="summary">

            <div class="summary-card">
                <h2 id="taskCount">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="summary-card">
                <h2 id="completedCount">0</h2>
                <p>Completed</p>
            </div>

            <div class="summary-card">
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
            </div>

        </section>


        <!-- TASK LIST -->
        <section class="tasks-section">

            <div class="section-heading">

                <h2>All Tasks</h2>

                <span id="taskLabel">0 tasks</span>

            </div>

            <ul id="taskList"></ul>

        </section>


        <!-- FOOTER -->
        <footer>
            Made to keep your day productive.
        </footer>

    </main>


    <!-- JavaScript Connection -->
    <script src="script.js"></script>

</body>
</html>
